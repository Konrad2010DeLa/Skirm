[build]
  command = "npm install"
  functions = "netlify/functions"
  publish = "public"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@supabase/supabase-js"]

[[redirects]]
  from = "/api/snapshots"
  to = "/.netlify/functions/list-snapshots"
  status = 200
  force = true
  methods = ["GET"]

[[redirects]]
  from = "/api/snapshots"
  to = "/.netlify/functions/upload-snapshot"
  status = 200
  force = true
  methods = ["POST"]

[[redirects]]
  from = "/snapshot/:id"
  to = "/.netlify/functions/view-snapshot/:id"
  status = 200
  force = true

[[redirects]]
  from = "/api/snapshots/:id"
  to = "/.netlify/functions/get-snapshot/:id"
  status = 200
  force = true
