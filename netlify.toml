[build]
  command = "npm install"
  functions = "netlify/functions"
  publish = "public"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/snapshots"
  to = "/.netlify/functions/upload-snapshot"
  status = 200
  force = true

[[redirects]]
  from = "/snapshot/:id"
  to = "/.netlify/functions/view-snapshot?id=:id"
  status = 200
  force = true

[[redirects]]
  from = "/api/snapshots/:id"
  to = "/.netlify/functions/get-snapshot?id=:id"
  status = 200
  force = true


